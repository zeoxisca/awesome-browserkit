</style><nav><strong>◈ Fieldnotes</strong><span>工作台</span><span>项目 / 2026</span></nav><main><div class="eyebrow">输入与导航示例</div><h1>工作笔记</h1><p>填写笔记、发送请求或打开详情页。</p><div class="grid"><section class="card"><h2>新增笔记</h2><label for="idea">笔记内容</label><input id="idea" placeholder="输入笔记"><button id="save" onclick="document.querySelector('#result').textContent='已记录：'+document.querySelector('#idea').value;console.info('笔记已保存')">保存笔记</button><button class="secondary" onclick="fetch('/site/api/status').then(r=>r.json()).then(d=>{document.querySelector('#result').textContent=d.message;console.log('网络请求完成',d)})">测试网络请求</button><div id="result" class="result">尚未保存</div></section><section class="card"><h2>项目列表</h2><div class="row"><i class="dot"></i> 网站改版 <span>已完成</span></div><div class="row"><i class="dot"></i> 移动端适配 <span>已完成</span></div><div class="row"><i class="dot"></i> 接口测试 <span>进行中</span></div><div style="margin-top:18px"><a class="button" href="/site/detail.html" target="_blank">打开项目详情 ↗</a></div></section></div><div class="footer">Fieldnotes · BrowserKit 示例页面</div></main><script>console.info('Fieldnotes 工作台已加载');fetch('/site/api/status').then(r=>r.json()).then(v=>console.log('工作台状态',v))</script></html>
