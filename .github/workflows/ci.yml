name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            react/package-lock.json
            examples/demo/web/package-lock.json
      - run: make install
      - run: make test
      - run: make race
      - run: go vet ./...
      - run: make build
      - run: make pack
      - run: git diff --exit-code
